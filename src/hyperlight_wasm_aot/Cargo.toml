[package]
name = "hyperlight-wasm-aot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = """
Application to precompile WebAssembly binaries to for hyperlight-wasm.
"""

[dependencies]
# Since we can use the library with either the latest bundled wasmtime or the LTS version
# we need to bundle both here as dependencies.
# The default is the LTS version. To use the latest version pass --wasmtime-version latest.
wasmtime = { version = "47.0.4", default-features = false, features = ["cranelift", "pulley", "runtime", "component-model"] }
wasmtime_lts = { package = "wasmtime", version = "36.0.14", default-features = false, features = ["cranelift", "pulley", "runtime", "component-model"] }
clap = { version = "4.6", features = ["derive"] }
cargo_metadata = "0.23"
cargo-util-schemas = "=0.14.1"
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf"] }
cargo-hyperlight = "0.1.14"
tar = "0.4.46"
# Makes Cargo fetch the runtime source that `experimental-build-runtime` builds.
hyperlight-wasm-runtime.workspace = true

[build-dependencies]
cargo_metadata = "0.23"
tar = "0.4.46"

[features]
gdb = ["wasmtime/debug-builtins", "wasmtime_lts/debug-builtins"]
