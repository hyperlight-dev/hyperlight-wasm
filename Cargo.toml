[workspace]
members = [ "src/hyperlight_wasm", "src/hyperlight_wasm_capi", "src/hyperlight_wasm_bindgen", "src/examples_common", "src/hyperlight_wasm_aot", "src/hyperlight_wasm_runtime", "src/hyperlight_wasm_macro" ]
exclude = [ "src/tests/rust_guests/rust_wasm_samples", "src/tests/rust_guests/component_sample", "src/tests/rust_guests/greeter_sample" ]
resolver = "2"

[workspace.package]
version = "0.15.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
homepage = "https://github.com/hyperlight-dev/hyperlight-wasm"
repository = "https://github.com/hyperlight-dev/hyperlight-wasm"
readme = "README.md"

[workspace.dependencies]
hyperlight-common = { version = "0.18.0", default-features = false }
hyperlight-component-macro = "0.18.0"
hyperlight-component-csharp = "0.18.0"
hyperlight-component-util = "0.18.0"
hyperlight-guest = "0.18.0"
hyperlight-guest-bin = "0.18.0"
hyperlight-host = { version = "0.18.0", default-features = false }
hyperlight-wasm-macro = { version = "0.15.0", path = "src/hyperlight_wasm_macro" }
hyperlight-wasm-runtime = { version = "0.15.0", path = "src/hyperlight_wasm_runtime" }

# Unreleased hyperlight with the component wire format and C# bindings.
# Remove once hyperlight releases these changes.
[patch.crates-io]
hyperlight-host = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-common = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-guest = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-guest-bin = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-guest-macro = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-guest-tracing = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-libc = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-component-macro = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-component-util = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
hyperlight-component-csharp = { git = "https://github.com/hyperlight-dev/hyperlight", branch = "component-wire-format" }
