# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The only workflow that writes the caches pull requests restore. Entries
# saved on main are restorable from every pull request. Every other workflow
# only reads them.
#
# Each job looks up the entry for its current lockfiles and toolchain. If it
# is missing, the job builds from a cold target and saves. rust-cache keeps
# every dependency version it restores, so a build on a restored entry would
# grow it with each lockfile change. Tests and examples build but do not run.
#
# Keys hash lockfiles and toolchains, not build commands. Bump `prefix-key` in
# every rust-cache step after changing what a job here builds.

name: Prime Caches

on:
  push:
    branches: [main]
  workflow_dispatch:

# A new run replaces a pending one and never cancels the running one, so the
# newest commit always saves.
concurrency:
  group: prime-caches-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Populate the tools and wasm-modules caches. The other jobs compile against
  # the WIT worlds in its artifacts.
  wasm-examples:
    uses: ./.github/workflows/dep_build_wasm_examples.yml
    with:
      prime_cache: true

  # Populate the v1-rust-code-checks-{linux,windows} caches.
  code-checks:
    needs: wasm-examples
    uses: ./.github/workflows/dep_code_checks.yml
    with:
      prime_cache: true

  # Populate the host caches (key {arch}-{os}-{hypervisor}-{config}) used by
  # dep_rust.yml. Release entries hold both wasmtime versions, because the LTS
  # and latest release jobs share them.
  host:
    needs: wasm-examples
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            hypervisor: hyperv
            config: debug
          - arch: X64
            hypervisor: hyperv
            config: release
          - arch: arm64
            hypervisor: hyperv
            config: debug
          - arch: arm64
            hypervisor: hyperv
            config: release
          - arch: arm64
            hypervisor: kvm
            config: debug
          - arch: arm64
            hypervisor: kvm
            config: release
    # Spread load across vendor pools: AMD when run_id ends in 0,2,4,6,8, Intel otherwise.
    runs-on: ${{ fromJson(matrix.arch == 'X64'
        && format('["self-hosted", "Windows", "X64", "1ES.Pool=hld-win2025-{0}", "JobId=prime-cache-{1}-{2}-{3}-{4}-{5}"]',
            (endsWith(github.run_id, '0') || endsWith(github.run_id, '2') || endsWith(github.run_id, '4') || endsWith(github.run_id, '6') || endsWith(github.run_id, '8')) && 'amd' || 'intel',
            matrix.hypervisor,
            matrix.config,
            github.run_id,
            github.run_number,
            github.run_attempt)
        || matrix.hypervisor == 'hyperv'
        && format('["self-hosted", "Windows", "ARM64", "1ES.Pool=hl-windows-arm", "JobId=prime-cache-{0}-{1}-{2}-{3}"]',
            matrix.config,
            github.run_id,
            github.run_number,
            github.run_attempt)
        || '["self-hosted", "Linux", "arm64", "kvm"]') }}
    env:
      JUST_OVERRIDE_ARCH: ${{ matrix.arch == 'X64' && 'x86_64' || 'aarch64' }}
    steps:
      - uses: actions/checkout@v5

      - name: Hyperlight setup
        uses: hyperlight-dev/ci-setup-workflow@v2.3.1
        with:
          rust-toolchain: "1.94"
          just-version: 1.59.0

      - name: Configure ARM64 libclang
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not $env:VSINSTALLDIR) {
            throw "Visual Studio developer environment did not set VSINSTALLDIR"
          }
          $libclang = Join-Path $env:VSINSTALLDIR "VC\Tools\Llvm\ARM64\bin\libclang.dll"
          if (-not (Test-Path $libclang)) {
            throw "ARM64 libclang not found at '$libclang'"
          }
          $llvmPath = Split-Path $libclang
          "LIBCLANG_PATH=$llvmPath" >> $env:GITHUB_ENV
          $llvmPath >> $env:GITHUB_PATH

      # Keep the steps before this one in sync with the build job in
      # dep_rust.yml. The key hashes the installed toolchains and the Rust and
      # C build env vars.
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: "${{ matrix.arch }}-${{ runner.os }}-${{ matrix.hypervisor }}-${{ matrix.config }}"
          lookup-only: true

      - name: Restore sysroot cache
        id: sysroot-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/hyperlight-wasm-runtime/sysroot
          key: sysroot-${{ matrix.arch }}-${{ runner.os }}-${{ matrix.hypervisor }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Check whether the caches are up to date
        id: prime
        run: echo "skip=${{ steps.rust-cache.outputs.cache-hit == 'true' && steps.sysroot-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Download Wasm Modules
        if: steps.prime.outputs.skip != 'true'
        uses: actions/download-artifact@v5
        with:
          name: guest-modules-${{ matrix.arch }}-lts
          path: .

      - name: Build host, tests and examples
        if: steps.prime.outputs.skip != 'true'
        run: |
          features="${{ matrix.hypervisor == 'kvm' && 'kvm' || '' }}"
          just prime-caches ${{ matrix.config }} $features
          if [ "${{ matrix.config }}" = release ]; then
            just prime-caches release ${features:+$features,}wasmtime_latest
          fi

      # A job step, not a post-job step, so the save runs before rust-cache's
      # post-job cleanup deletes the sysroot.
      - name: Save sysroot cache
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/hyperlight-wasm-runtime/sysroot
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

  # Rust keys end in a toolchain hash and a lockfile hash. The other keys end
  # in one hash. Each change leaves the old entry behind. Keep the newest entry
  # per key and delete the rest to stay under the repository cache quota.
  cleanup:
    needs: [wasm-examples, code-checks, host]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded caches
        run: |
          # Filter by key prefix. The listing caps at 1000 entries.
          for prefix in v1-rust- sysroot- tools- wasm-modules-; do
            gh cache list --ref "$GITHUB_REF" --key "$prefix" --limit 1000 --json id,key,createdAt
          done | jq -s -r '
            add
            | group_by(.key | if startswith("v1-rust-") then sub("-[^-]*-[^-]*$"; "") else sub("-[^-]*$"; "") end)
            | map(sort_by(.createdAt) | reverse | .[1:][])
            | .[] | "\(.id) \(.key)"' |
          while read -r id key; do
            echo "Deleting $key"
            gh cache delete "$id" || echo "::warning::Failed to delete $key"
          done
