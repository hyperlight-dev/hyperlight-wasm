# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# See README.md in this directory for more information about workflow_call

name: Build Wasm Examples

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      docs_only:
        description: Skip building if docs only
        required: false
        type: string
        default: "false"
      prime_cache:
        description: Save the tool and module caches when they miss.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
    build-wasm-examples:
      if: ${{ inputs.docs_only != 'true' }}
      timeout-minutes: ${{ fromJSON(vars.BUILD_WASM_EXAMPLES_JOB_TIMEOUT || '30') }}
      strategy:
        matrix:
          wasmtime_version:
            - name: lts
              features: ""
              profiles: "debug release"
            # Build jobs skip debug for wasmtime latest.
            - name: latest
              features: "wasmtime_latest"
              profiles: "release"
          arch:
            - name: X64
              # LLVM 18 has no apt.llvm.org packages for Ubuntu 26.04.
              runner: ubuntu-24.04
            - name: arm64
              runner: ubuntu-24.04-arm
      runs-on: ${{ matrix.arch.runner }}
      steps:
        - uses: actions/checkout@v5
        # The key hashes every input to the modules, so a hit skips the build.
        - name: Restore Wasm Modules cache
          id: modules-cache
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
          with:
            path: |
              build/*/*.aot
              build/*/pulley/*.aot
              src/tests/rust_guests/component_sample/wit/component-world.wasm
              src/tests/c_guests/wasmsamples/components/runcomponent-world.wasm
              build/*/component-sample-runtime
            key: wasm-modules-${{ matrix.arch.name }}-${{ matrix.wasmtime_version.name }}-${{ hashFiles('src/tests/**', 'src/hyperlight_wasm_aot/**', 'src/hyperlight_wasm_runtime/**', 'src/hyperlight_wasm_macro/**', 'Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml', 'Justfile', 'c.just', '.github/workflows/dep_build_wasm_examples.yml') }}
        - name: Remove default clang
          if: steps.modules-cache.outputs.cache-hit != 'true'
          run: sudo rm /usr/bin/clang
        - name: Fake /dev/kvm for ci-setup-workflow action
          if: steps.modules-cache.outputs.cache-hit != 'true'
          run: sudo touch /dev/kvm
        - name: Hyperlight setup workflow
          if: steps.modules-cache.outputs.cache-hit != 'true'
          uses: hyperlight-dev/ci-setup-workflow@v2.3.1
          with:
            rust-toolchain: "1.94"
            additional-toolchain-directory: src/tests/rust_guests
        # The Justfile pins the tool versions. On a key miss, restore-keys restores the
        # previous binaries and ensure-tools reinstalls only the tools whose pin changed.
        - name: Restore tools cache
          id: tools-cache
          if: steps.modules-cache.outputs.cache-hit != 'true'
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
          with:
            path: |
              ~/.cargo/bin/wasm-tools
              ~/.cargo/bin/cargo-component
              ~/.cargo/bin/wit-bindgen
              ~/.cargo/bin/cargo-hyperlight
            key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Justfile') }}
            restore-keys: tools-${{ runner.os }}-${{ runner.arch }}-
        - name: Build Modules (wasmtime ${{ matrix.wasmtime_version.name }})
          if: steps.modules-cache.outputs.cache-hit != 'true'
          run: |
            just ensure-tools
            just build-ci-examples "${{ matrix.wasmtime_version.features }}" "${{ matrix.wasmtime_version.profiles }}"
          shell: bash
        - name: Save tools cache
          if: inputs.prime_cache && steps.modules-cache.outputs.cache-hit != 'true' && steps.tools-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
          with:
            path: |
              ~/.cargo/bin/wasm-tools
              ~/.cargo/bin/cargo-component
              ~/.cargo/bin/wit-bindgen
              ~/.cargo/bin/cargo-hyperlight
            key: ${{ steps.tools-cache.outputs.cache-primary-key }}
        - name: Save Wasm Modules cache
          if: inputs.prime_cache && steps.modules-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
          with:
            path: |
              build/*/*.aot
              build/*/pulley/*.aot
              src/tests/rust_guests/component_sample/wit/component-world.wasm
              src/tests/c_guests/wasmsamples/components/runcomponent-world.wasm
              build/*/component-sample-runtime
            key: ${{ steps.modules-cache.outputs.cache-primary-key }}
        # Build jobs compile examples against the WIT worlds, so they ship with the modules.
        - name: Upload Wasm Modules (wasmtime ${{ matrix.wasmtime_version.name }})
          uses: actions/upload-artifact@v4
          with:
            name: guest-modules-${{ matrix.arch.name }}-${{ matrix.wasmtime_version.name }}
            if-no-files-found: error
            path: |
              build/*/*.aot
              build/*/pulley/*.aot
              src/tests/rust_guests/component_sample/wit/component-world.wasm
              src/tests/c_guests/wasmsamples/components/runcomponent-world.wasm
              build/*/component-sample-runtime
