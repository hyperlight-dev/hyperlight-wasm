# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# See README.md in this directory for more information about workflow_call

name: Build Wasm Examples

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      docs_only:
        description: Skip building if docs only
        required: false
        type: string
        default: "false"
  schedule:
    # Run at 1am UTC daily
    - cron: '0 1 * * *'

permissions:
  packages: write
  contents: read

jobs:
    build-docker-image:
      if: ${{ inputs.docs_only == 'false' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      strategy:
        matrix:
          arch:
            - name: X64
              runner: ubuntu-latest
              docker-platform: linux/amd64
            - name: arm64
              runner: ubuntu-24.04-arm
              docker-platform: linux/arm64
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
          with:
            fetch-depth: 0
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Pull wasm-clang-builder
          continue-on-error: true
          run: |
                docker pull ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:latest
        - name: Set up Docker image metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ github.repository_owner }}/wasm-clang-builder
        - name: Calculate ghcr cache destination
          id: ghcr-dest
          env:
            CAN_WRITE: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && github.actor != 'dependabot[bot]' }}
          run: |
            if [ "$CAN_WRITE" = "true" ]; then
              echo "CACHE_TO=type=registry,ref=ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:buildcache,mode=max" >> $GITHUB_ENV
              echo "DO_PUSH=true" >> $GITHUB_ENV
              echo "DO_PUSH=false" >> $GITHUB_OUTPUT
            else
              echo "CACHE_TO=type=local,dest=/tmp/wasm-clang-builder-cache/" >> $GITHUB_ENV
              echo "DO_PUSH=false" >> $GITHUB_ENV
              echo "DO_PUSH=false" >> $GITHUB_OUTPUT
            fi
        - name: Build and push wasm-clang-builder
        # Only push if not from a fork, not from pull request, and not from dependabot
          uses: docker/build-push-action@v6
          with:
            context: src/tests/c_guests/wasmsamples
            file: src/tests/c_guests/wasmsamples/dockerfile
            load: true
            push: ${{ env.DO_PUSH }}
            build-args: |
              WASI_SDK_VERSION_FULL=25.0
              GCC_VERSION=12
            platforms: ${{ matrix.arch.docker-platform }}
            tags: ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:latest-${{ matrix.arch.name }}
            cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:buildcache
            cache-to: ${{ env.CACHE_TO }}
      outputs:
        do_push: ${{ steps.ghcr-dest.outputs.DO_PUSH }}

    merge-docker-image:
      needs: build-docker-image
      if: ${{ needs.build-docker-image.outputs.do_push }}
      runs-on: ubuntu-latest
      steps:
        - name: Login to Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Create manifest
          run: |
            docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:latest \
              ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:latest-X64 \
              ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:latest-arm64

    build-wasm-examples:
      needs: merge-docker-image
      # Required because merge-docker-image is skipped on some runs,
      # and a skipped dependency transitively skips all downstream
      # jobs.  See: https://github.com/actions/runner/issues/2205
      if: ${{ !cancelled() && !failure() }}
      strategy:
        matrix:
          wasmtime_version:
            - name: lts
              features: ""
            - name: latest
              features: "wasmtime_latest"
          arch:
            - name: X64
              runner: ubuntu-latest
            - name: arm64
              runner: ubuntu-24.04-arm
      runs-on: ${{ matrix.arch.runner }}
      steps:
        - uses: actions/checkout@v5
          with:
            fetch-depth: 0
        - name: Remove default clang
          run: sudo rm /usr/bin/clang
        - name: Fake /dev/kvm for ci-setup-workflow action
          run: sudo touch /dev/kvm
        - name: Hyperlight setup workflow
          uses: hyperlight-dev/ci-setup-workflow@v2.3.1
          with:
            rust-toolchain: "1.94"
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Login to Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Pull wasm-clang-builder
          run: |
                docker pull ghcr.io/${{ github.repository_owner }}/wasm-clang-builder:latest
        - name: Build Modules (wasmtime ${{ matrix.wasmtime_version.name }})
          run: |
            just ensure-tools
            just build-wasm-examples release ${{ matrix.wasmtime_version.features }}
          shell: bash
        - name: Upload Wasm Modules (wasmtime ${{ matrix.wasmtime_version.name }})
          uses: actions/upload-artifact@v4
          with:
            name: guest-modules-${{ matrix.arch.name }}-${{ matrix.wasmtime_version.name }}
            path: | 
              build/release/*.aot
